{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold text-gray-800 mb-6">学部管理</h2>
<div class="flex gap-3 mb-6"><input id="new-dept-name" class="input max-w-xs" placeholder="输入学部名称"><button onclick="addDept()" class="btn-primary whitespace-nowrap"><i class="fa-solid fa-plus mr-1"></i>添加</button></div>
<div class="card"><div id="dept-list" class="divide-y"><div class="py-4 text-center text-gray-400">加载中...</div></div></div>
<script>
async function loadDepts() { try { var data = await api("/api/users/departments/all"); var list = document.getElementById("dept-list"); var html = ""; data.departments.forEach(function(d){html += '<div class="flex items-center justify-between py-3"><div class="flex items-center gap-3"><span class="font-medium text-gray-800">'+d.name+'</span>'+(d.is_active?'<span class="badge badge-approved">启用</span>':'<span class="badge badge-rejected">禁用</span>')+'</div><div class="flex gap-2"><button onclick="editDept('+d.id+',\''+d.name+'\')" class="text-primary-600 hover:text-primary-800 text-sm">编辑</button><button onclick="toggleDept('+d.id+','+d.is_active+')" class="'+(d.is_active?'text-red-500':'text-green-500')+' hover:opacity-80 text-sm">'+(d.is_active?'禁用':'启用')+'</button><button onclick="deleteDept('+d.id+')" class="text-red-500 hover:text-red-700 text-sm"><i class="fa-solid fa-trash"></i></button></div></div>'}); list.innerHTML = html } catch(e) { document.getElementById("dept-list").innerHTML = '<div class="py-4 text-center text-red-400">'+e.message+'</div>' } }
async function addDept() { var n=document.getElementById("new-dept-name").value.trim(); if(!n) return; var fd=new FormData(); fd.append("name",n); try { await apiForm("/api/users/departments",fd); document.getElementById("new-dept-name").value=""; showToast("已添加"); loadDepts() } catch(e){showToast(e.message,"error")} }
async function editDept(id,old) { var n=prompt("修改名称：",old); if(!n||n===old) return; var fd=new FormData(); fd.append("name",n); try { var res = await fetch("/api/users/departments/"+id,{method:"PUT",headers:{"Authorization":"Bearer "+TOKEN},body:fd}); if(!res.ok) throw new Error("failed"); showToast("已更新"); loadDepts() } catch(e){showToast(e.message,"error")} }
async function toggleDept(id,cur) { var fd=new FormData(); fd.append("is_active",cur?"0":"1"); try { await apiForm("/api/users/departments/"+id,fd); showToast(cur?"已禁用":"已启用"); loadDepts() } catch(e){showToast(e.message,"error")} }
async function deleteDept(id) { if(!confirm("确认删除？")) return; try { await apiDel("/api/users/departments/"+id); showToast("已删除"); loadDepts() } catch(e){showToast(e.message,"error")} }
loadDepts();
</script>
{% endblock %}
