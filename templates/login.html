<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 演播厅预约管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-primary-600 shadow-lg mb-4">
                <i class="fa-solid fa-building-columns text-white text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">演播厅预约管理</h1>
            <p class="text-gray-500 mt-1">请登录您的账户</p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-8">
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-1.5" for="username">用户名</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input id="username" type="text" class="w-full border border-gray-300 rounded-lg pl-10 px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="请输入用户名" required autofocus>
                    </div>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1.5" for="password">密码</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input id="password" type="password" class="w-full border border-gray-300 rounded-lg pl-10 px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="请输入密码" required>
                    </div>
                </div>
                <div id="error-msg" class="text-red-500 text-sm mb-4 hidden"></div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-medium text-lg transition-colors">
                    登 录
                </button>
            </form>
        </div>

        <p class="text-center text-gray-400 text-sm mt-6">默认密码：123456</p>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errEl = document.getElementById('error-msg');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Login failed');
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('user', JSON.stringify(data.user));
                document.cookie = 'token=' + data.access_token + '; path=/; SameSite=Lax';
                window.location.href = '/dashboard';
            } catch (err) {
                errEl.textContent = err.message;
                errEl.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
